<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260">
  <defs>
    <style>
      .banner-title {
        font-family: 'Sacramento', 'Brush Script MT', 'Caveat', cursive, sans-serif;
        font-size: 52px;
        font-weight: bold;
        fill: #5A3E42;
      }
      .banner-subtitle {
        font-family: 'Caveat', 'Segoe Script', 'Comic Sans MS', cursive, sans-serif;
        font-size: 20px;
        letter-spacing: 2px;
        fill: #D85A67;
      }
      .banner-dedication {
        font-family: 'Caveat', cursive, sans-serif;
        font-size: 17px;
        font-style: italic;
        fill: #8C6A70;
      }
      .banner-badge {
        font-family: 'Nunito', 'Segoe UI', sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #FFFFFF;
      }
    </style>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDFE"/>
      <stop offset="100%" stop-color="#FFF3F6"/>
    </linearGradient>
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.2" fill="#F3D5DC" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Base Card with Soft Cream Gradient & Warm Cocoa Outline -->
  <rect x="8" y="8" width="844" height="244" rx="24" fill="url(#creamGrad)" stroke="#5A3E42" stroke-width="2.5"/>
  <rect x="14" y="14" width="832" height="232" rx="20" fill="url(#dotPattern)" opacity="0.5"/>

  <!-- Scalloped Inner Frame Trim -->
  <rect x="22" y="22" width="816" height="216" rx="16" fill="none" stroke="#E2B8BF" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Decorative Corner Vignettes: Hand-Drawn White Rosebuds with Sage Leaves -->
  <!-- Top Left Rosebud -->
  <g transform="translate(42, 42) rotate(-20) scale(0.65)">
    <path d="M 0 10 C -12 6, -16 20, -10 26 C -2 28, 4 18, 0 10 Z" fill="#B8C9B0" stroke="#5A3E42" stroke-width="1.5"/>
    <path d="M -8 10 C -12 0, -8 -12, 0 -16 C 8 -12, 12 0, 8 10 Z" fill="#FFFFFF" stroke="#5A3E42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -6 8 C -6 -2, -2 -10, 0 -12 C 4 -8, 4 0, 4 8 Z" fill="#FFFDF7" stroke="#5A3E42" stroke-width="1.4"/>
    <path d="M -2 2 C -3 -3, 0 -7, 0 -8 C 2 -6, 1 0, 1 4 Z" fill="#F7E6EA" stroke="#5A3E42" stroke-width="1.2"/>
  </g>

  <!-- Top Right Rosebud -->
  <g transform="translate(818, 42) rotate(20) scale(0.65)">
    <path d="M 0 10 C 12 6, 16 20, 10 26 C 2 28, -4 18, 0 10 Z" fill="#B8C9B0" stroke="#5A3E42" stroke-width="1.5"/>
    <path d="M 8 10 C 12 0, 8 -12, 0 -16 C -8 -12, -12 0, -8 10 Z" fill="#FFFFFF" stroke="#5A3E42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 6 8 C 6 -2, 2 -10, 0 -12 C -4 -8, -4 0, -4 8 Z" fill="#FFFDF7" stroke="#5A3E42" stroke-width="1.4"/>
    <path d="M 2 2 C 3 -3, 0 -7, 0 -8 C -2 -6, -1 0, -1 4 Z" fill="#F7E6EA" stroke="#5A3E42" stroke-width="1.2"/>
  </g>

  <!-- Bottom Left Rosebud -->
  <g transform="translate(42, 218) rotate(-160) scale(0.65)">
    <path d="M 0 10 C -12 6, -16 20, -10 26 C -2 28, 4 18, 0 10 Z" fill="#B8C9B0" stroke="#5A3E42" stroke-width="1.5"/>
    <path d="M -8 10 C -12 0, -8 -12, 0 -16 C 8 -12, 12 0, 8 10 Z" fill="#FFFFFF" stroke="#5A3E42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -6 8 C -6 -2, -2 -10, 0 -12 C 4 -8, 4 0, 4 8 Z" fill="#FFFDF7" stroke="#5A3E42" stroke-width="1.4"/>
  </g>

  <!-- Bottom Right Rosebud -->
  <g transform="translate(818, 218) rotate(160) scale(0.65)">
    <path d="M 0 10 C 12 6, 16 20, 10 26 C 2 28, -4 18, 0 10 Z" fill="#B8C9B0" stroke="#5A3E42" stroke-width="1.5"/>
    <path d="M 8 10 C 12 0, 8 -12, 0 -16 C -8 -12, -12 0, -8 10 Z" fill="#FFFFFF" stroke="#5A3E42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 6 8 C 6 -2, 2 -10, 0 -12 C -4 -8, -4 0, -4 8 Z" fill="#FFFDF7" stroke="#5A3E42" stroke-width="1.4"/>
  </g>

  <!-- Miniature Photobooth Strips on Left & Right -->
  <!-- Left Strip: Tilted (-10 deg) -->
  <g transform="translate(68, 48) rotate(-10)">
    <rect x="0" y="0" width="56" height="150" rx="6" fill="#FFFFFF" stroke="#5A3E42" stroke-width="1.8"/>
    <rect x="6" y="8" width="44" height="28" rx="3" fill="#FFEBF0" stroke="#E2B8BF" stroke-width="1"/>
    <rect x="6" y="42" width="44" height="28" rx="3" fill="#FFF0F4" stroke="#E2B8BF" stroke-width="1"/>
    <rect x="6" y="76" width="44" height="28" rx="3" fill="#FFEBF0" stroke="#E2B8BF" stroke-width="1"/>
    <rect x="6" y="110" width="44" height="28" rx="3" fill="#FFF0F4" stroke="#E2B8BF" stroke-width="1"/>
    <!-- Mini white rose sketch in Cut 1 -->
    <circle cx="28" cy="22" r="5" fill="#FFFFFF" stroke="#5A3E42" stroke-width="1"/>
    <path d="M 28 20 C 26 21, 27 23, 29 23" fill="none" stroke="#5A3E42" stroke-width="0.8"/>
    <circle cx="28" cy="56" r="4" fill="#FFCCD7"/>
    <path d="M 28 88 C 26 86, 23 86, 23 89 C 23 92, 28 95, 28 95 C 28 95, 33 92, 33 89 C 33 86, 30 86, 28 88 Z" fill="#D85A67"/>
  </g>

  <!-- Right Strip: Tilted (+10 deg) -->
  <g transform="translate(734, 42) rotate(10)">
    <rect x="0" y="0" width="56" height="150" rx="6" fill="#FFFFFF" stroke="#5A3E42" stroke-width="1.8"/>
    <rect x="6" y="8" width="44" height="28" rx="3" fill="#FFF0F4" stroke="#E2B8BF" stroke-width="1"/>
    <rect x="6" y="42" width="44" height="28" rx="3" fill="#FFEBF0" stroke="#E2B8BF" stroke-width="1"/>
    <rect x="6" y="76" width="44" height="28" rx="3" fill="#FFF0F4" stroke="#E2B8BF" stroke-width="1"/>
    <rect x="6" y="110" width="44" height="28" rx="3" fill="#FFEBF0" stroke="#E2B8BF" stroke-width="1"/>
    <path d="M 28 20 C 26 18, 23 18, 23 21 C 23 24, 28 27, 28 27 C 28 27, 33 24, 33 21 C 33 18, 30 18, 28 20 Z" fill="#D85A67"/>
    <circle cx="28" cy="90" r="4" fill="#FFCCD7"/>
  </g>

  <!-- Flanking Hand-Drawn White Roses next to Center Bow -->
  <!-- Left Rose -->
  <g transform="translate(345, 48) scale(0.42)">
    <path d="M 32 64 C 14 68, 8 82, 14 90 C 26 92, 38 82, 42 70 Z" fill="#B8C9B0" stroke="#5A3E42" stroke-width="3" stroke-linecap="round"/>
    <path d="M 50 12 C 34 10, 18 22, 22 40 C 24 48, 30 52, 36 54 C 44 40, 56 40, 64 54 C 70 52, 76 48, 78 40 C 82 22, 66 10, 50 12 Z" fill="#FFFFFF" stroke="#5A3E42" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 20 36 C 8 48, 10 70, 26 78 C 36 84, 44 80, 48 76 C 32 70, 26 52, 30 38 Z" fill="#FFFFFF" stroke="#5A3E42" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 80 36 C 92 48, 90 70, 74 78 C 64 84, 56 80, 52 76 C 68 70, 74 52, 70 38 Z" fill="#FFFFFF" stroke="#5A3E42" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 30 74 C 38 88, 62 88, 70 74 C 60 80, 40 80, 30 74 Z" fill="#FFFFFF" stroke="#5A3E42" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 32 42 C 28 54, 32 68, 48 72 C 58 68, 60 58, 56 46 C 44 44, 36 46, 32 42 Z" fill="#FFFDF7" stroke="#5A3E42" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 68 42 C 72 54, 68 68, 52 72 C 42 66, 44 56, 50 46 C 58 44, 64 44, 68 42 Z" fill="#FFFDF7" stroke="#5A3E42" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 42 44 C 40 50, 44 58, 52 58 C 58 56, 60 48, 56 44 C 50 40, 46 42, 42 44 Z" fill="#F7E6EA" stroke="#5A3E42" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 46 48 C 44 50, 48 54, 52 53 C 55 52, 55 48, 51 47" fill="none" stroke="#5A3E42" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Right Rose -->
  <g transform="translate(515, 48) scale(0.42)">
    <path d="M 68 64 C 86 68, 92 82, 86 90 C 74 92, 62 82, 58 70 Z" fill="#B8C9B0" stroke="#5A3E42" stroke-width="3" stroke-linecap="round"/>
    <path d="M 50 12 C 34 10, 18 22, 22 40 C 24 48, 30 52, 36 54 C 44 40, 56 40, 64 54 C 70 52, 76 48, 78 40 C 82 22, 66 10, 50 12 Z" fill="#FFFFFF" stroke="#5A3E42" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 20 36 C 8 48, 10 70, 26 78 C 36 84, 44 80, 48 76 C 32 70, 26 52, 30 38 Z" fill="#FFFFFF" stroke="#5A3E42" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 80 36 C 92 48, 90 70, 74 78 C 64 84, 56 80, 52 76 C 68 70, 74 52, 70 38 Z" fill="#FFFFFF" stroke="#5A3E42" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 30 74 C 38 88, 62 88, 70 74 C 60 80, 40 80, 30 74 Z" fill="#FFFFFF" stroke="#5A3E42" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 32 42 C 28 54, 32 68, 48 72 C 58 68, 60 58, 56 46 C 44 44, 36 46, 32 42 Z" fill="#FFFDF7" stroke="#5A3E42" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 68 42 C 72 54, 68 68, 52 72 C 42 66, 44 56, 50 46 C 58 44, 64 44, 68 42 Z" fill="#FFFDF7" stroke="#5A3E42" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 42 44 C 40 50, 44 58, 52 58 C 58 56, 60 48, 56 44 C 50 40, 46 42, 42 44 Z" fill="#F7E6EA" stroke="#5A3E42" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 46 48 C 44 50, 48 54, 52 53 C 55 52, 55 48, 51 47" fill="none" stroke="#5A3E42" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Center Artwork: Hand-Drawn Coquette Bow -->
  <g transform="translate(430, 48)">
    <!-- Left Ribbon Loop -->
    <path d="M 0 0 C -22 -24, -46 -22, -48 -8 C -50 10, -22 14, 0 4" fill="#FFD1DC" stroke="#5A3E42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -36 -6 C -28 -2, -18 2, -5 2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Right Ribbon Loop -->
    <path d="M 0 0 C 22 -24, 46 -22, 48 -8 C 50 10, 22 14, 0 4" fill="#FFD1DC" stroke="#5A3E42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 36 -6 C 28 -2, 18 2, 5 2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Left Ribbon Tail -->
    <path d="M -4 5 C -12 16, -26 30, -32 38 C -26 36, -18 36, -12 39 C -6 28, -2 16, -1 6 Z" fill="#FFCCD7" stroke="#5A3E42" stroke-width="2.2" stroke-linejoin="round"/>
    
    <!-- Right Ribbon Tail -->
    <path d="M 4 5 C 12 16, 26 30, 32 38 C 26 36, 18 36, 12 39 C 6 28, 2 16, 1 6 Z" fill="#FFCCD7" stroke="#5A3E42" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Center Pearl Knot with Berry Red Accent -->
    <ellipse cx="0" cy="2" rx="7" ry="8" fill="#D85A67" stroke="#5A3E42" stroke-width="2.2"/>
    <circle cx="-2" cy="-0.5" r="2.2" fill="#FFFFFF"/>
  </g>

  <!-- Central Typography -->
  <!-- Tagline Pill -->
  <g transform="translate(340, 96)">
    <rect x="0" y="0" width="180" height="22" rx="11" fill="#FFD1DC" stroke="#5A3E42" stroke-width="1.2"/>
    <text x="90" y="15" text-anchor="middle" class="banner-badge">VIRTUAL COUPLES STUDIO</text>
  </g>

  <!-- Main Title -->
  <text x="430" y="156" text-anchor="middle" class="banner-title">Our Little Photobooth</text>

  <!-- Subtitle -->
  <text x="430" y="188" text-anchor="middle" class="banner-subtitle">Together From Afar  •  Bespoke 4-Cut Studio</text>

  <!-- Romantic Dedication Stamp -->
  <text x="430" y="216" text-anchor="middle" class="banner-dedication">~ made by mohar with love for gungun &lt;3 ~</text>
</svg>